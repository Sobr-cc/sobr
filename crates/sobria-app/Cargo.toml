# sobria-app: Tauri 2 wrapper (ADR-0001) and IPC commands (C09)
[package]
name = "sobria-app"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Application Tauri 2 — wrapper natif Sobr.ia"

[lib]
name = "sobria_app"
path = "src/lib.rs"

[[bin]]
name = "sobria-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
sobria-core = { path = "../sobria-core" }
sobria-referentiel = { path = "../sobria-referentiel" }
sobria-estimator = { path = "../sobria-estimator" }
sobria-audit = { path = "../sobria-audit" }
sobria-geoloc = { path = "../sobria-geoloc" }
sobria-export = { path = "../sobria-export" }
# Shares `BridgeRequest`/`BridgeResponse` and `default_socket_path()` with the
# bridge for the bridge-to-app socket.
sobria-bridge = { path = "../sobria-bridge" }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
rusqlite = { workspace = true }
csv = { workspace = true }
# Pairing: OS RNG for the shared secret.
rand = { workspace = true }
# Argon2id hash of the pairing secret.
argon2 = { workspace = true }
# Team mode: HTTPS REST client to sobria-team-aggregator (rustls; invalid certs
# accepted only on opt-in, for self-signed servers).
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# SOB-188 — mock app for the tests (`tauri::test`); an empty feature, no new crate.
tauri = { workspace = true, features = ["test"] }
