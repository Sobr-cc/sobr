# Stand-in for the Sobr server: a second collector that receives what collector.yaml forwards
# and writes it as JSON lines, so the result can be read (SOB-166).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4399

exporters:
  file:
    path: ${env:SOBR_STUB_LOG:-stub-log.jsonl}

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [file]
