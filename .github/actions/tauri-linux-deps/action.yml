name: Tauri Linux dependencies
description: System libraries the Tauri crates need to compile on Ubuntu.

runs:
  using: composite
  steps:
    # Debian list of https://v2.tauri.app/start/prerequisites/#linux, without
    # libssl-dev: no crate links OpenSSL (CLAUDE.md §7), so a new one must fail CI.
    - name: Install the Tauri system libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev
