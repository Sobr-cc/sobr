name: app-release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à builder (ex. v0.7.1). Si vide, utilise le ref courant.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/app-build.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  publish:
    name: publish
    needs: build
    # Publish what was built even if one OS failed, as when each build uploaded its own files.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: bundles

      - name: Check that something was built
        shell: bash
        run: |
          ls -la bundles/ || true
          if [ -z "$(ls -A bundles 2>/dev/null)" ]; then
            echo "No bundle was built: nothing to publish." && exit 1
          fi

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: bundles/*
          fail_on_unmatched_files: false
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
