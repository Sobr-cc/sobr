name: app-build

# Unsigned desktop builds on each OS, uploaded as artifacts.
# Called by ci.yml on pull requests and by app-release.yml on tags.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build. Empty means the triggering ref.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            rust-targets: 'x86_64-pc-windows-msvc'
            tauri-args: ''
          - os: macos-latest
            label: macos-aarch64
            rust-targets: 'aarch64-apple-darwin'
            tauri-args: '--target aarch64-apple-darwin'
          # macos-13 (Intel) runners were retired on 2025-12-04: cross-compile on Apple silicon.
          - os: macos-latest
            label: macos-x86_64
            rust-targets: 'x86_64-apple-darwin'
            tauri-args: '--target x86_64-apple-darwin'
          - os: ubuntu-22.04
            label: linux
            rust-targets: 'x86_64-unknown-linux-gnu'
            tauri-args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: ${{ matrix.label }}

      - name: Install Linux WebKit deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Tauri build
        working-directory: crates/sobria-app
        run: cargo tauri build ${{ matrix.tauri-args }}

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p bundles
          # Tauri output location depends on target. Glob to grab any bundle from this build.
          shopt -s globstar nullglob
          for f in target/**/release/bundle/**/* ; do
            ext="${f##*.}"
            case "$ext" in
              msi|exe|dmg|deb|AppImage|appimage)
                cp -v "$f" bundles/
                ;;
            esac
          done
          ls -la bundles/
          # Compute SHA-256 for each artifact
          cd bundles
          for f in *; do
            if [ -f "$f" ]; then
              if command -v shasum >/dev/null 2>&1; then
                shasum -a 256 "$f" > "${f}.sha256"
              else
                sha256sum "$f" > "${f}.sha256"
              fi
            fi
          done
          ls -la

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.label }}
          path: bundles/
          if-no-files-found: error
          retention-days: 14
