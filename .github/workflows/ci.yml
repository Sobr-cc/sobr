# CI Sobr.ia — see CLAUDE.md §5 (Definition of Done).
# CI must be green before a merge to main / develop, or fail only on jobs that also fail on main for the same cause (CLAUDE.md §11).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # ready_for_review reruns CI when a draft is marked ready: the desktop build skips drafts.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1
  SOBRIA_SEED: 42

jobs:
  rust-fmt-clippy:
    name: Rust — fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tauri-linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust — tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tauri-linux-deps
        if: runner.os == 'Linux'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same command as CLAUDE.md §10 and the local check. No crate declares
      # features, so --all-features would add nothing.
      - name: cargo test
        run: cargo test --workspace --no-fail-fast

  rust-coverage:
    name: Rust — coverage (informational)
    runs-on: ubuntu-latest
    # Informational, not blocking: this job never produced a report in 41 runs
    # (audit 2026-06-12) and its --fail-under 80 gate kept CI red without
    # measuring. Measure first, gate once the real figure is known (CLAUDE.md §5).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tauri-linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install tarpaulin
        run: cargo install cargo-tarpaulin --locked
      # The default ptrace engine adds -Clink-dead-code, which compiles the
      # never-called trait methods of polars-arrow and fires their
      # `const { assert!(false) }`. The LLVM engine does not (SOB-208).
      - name: cargo tarpaulin
        run: cargo tarpaulin --workspace --engine llvm --out Xml --output-dir coverage
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: coverage/cobertura.xml
          if-no-files-found: warn

  rust-security:
    name: Rust — audit (cargo audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-audit
        run: cargo install cargo-audit cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check

  web-lint-build:
    name: web — lint + check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  web-team-lint-build:
    name: web-team — lint + check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-team
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-team/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  ext-lint-build:
    name: Extension MV3 — lint + check + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build

  site-lint-build:
    name: Site (Astro) — check + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Copy the docs into src/content first, as site-deploy does.
      - run: npm run sync:docs
      - run: npm run check
      - run: npm run lint
      - run: npm run build

  web-playwright:
    name: web — Playwright
    runs-on: ubuntu-latest
    needs: web-lint-build
    strategy:
      fail-fast: false
      matrix:
        suite: [a11y, smoke]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:${{ matrix.suite }}

  size-budget:
    name: Frugality — binary sizes
    runs-on: ubuntu-latest
    needs: [rust-test, web-lint-build]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tauri-linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release
        run: cargo build --release --workspace
      - name: check sizes (NF-03, NF-04)
        run: |
          set -e
          # NF-03 target: desktop binary < 20 MB
          for bin in target/release/sobria-*; do
            if [ -f "$bin" ] && [ -x "$bin" ]; then
              size=$(stat --printf="%s" "$bin")
              echo "$bin : $size bytes"
              if [ "$size" -gt 20971520 ]; then
                echo "❌ $bin exceeds 20 MB (NF-03)" && exit 1
              fi
            fi
          done
          echo "✅ All sizes are within budget."

  app-paths:
    name: Desktop app — changed paths
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The pull request checkout is a merge commit: its first parent is the base.
      - id: diff
        shell: bash
        run: |
          git diff --name-only HEAD^1 HEAD > changed.txt
          if grep -qE '^(crates/|web/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/(app-build|ci)\.yml$|\.github/actions/)' changed.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No app path changed: the desktop build is skipped."
          fi

  app-build:
    name: Desktop app — unsigned build
    needs: [rust-fmt-clippy, web-lint-build, app-paths]
    if: needs.app-paths.outputs.changed == 'true'
    uses: ./.github/workflows/app-build.yml
