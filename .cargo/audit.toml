    "RUSTSEC-2026-0391", # zstd: needs with_context, which polars-parquet 0.46.0 never calls (SOB-196)
    "RUSTSEC-2026-0398", # zstd-safe: needs the seekable feature, which is not built (SOB-196)
    "RUSTSEC-2026-0403", # zstd-safe: hits only the write-side decoder, polars reads with the read-side one (SOB-196)
]
